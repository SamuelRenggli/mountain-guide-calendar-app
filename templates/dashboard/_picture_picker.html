{% load i18n %}<details class="field picture-picker{% if field.errors %} has-error{% endif %}"{% if field.value %} open{% endif %}>
  <summary>{{ field.label }} <span class="small muted">({% translate "eigene Bilder und Tourchef-Bilder, nach Tourenart" %})</span></summary>
  <label class="pick pick-none"><input type="radio" name="{{ field.html_name }}" value=""{% if not field.value %} checked{% endif %}> {% translate "Keines auswählen" %}</label>
  {% for label, pics in form.library_groups %}
    <p class="small pick-group">{{ label }}</p>
    <div class="pick-grid">
      {% for pic in pics %}
        <label class="pick" title="{{ pic.title }}">
          <input type="radio" name="{{ field.html_name }}" value="{{ pic.key }}"{% if field.value == pic.key %} checked{% endif %}>
          <img src="{{ pic.url }}" alt="{{ pic.title }}" loading="lazy">
          {% if pic.is_stock %}<span class="pick-badge">Tourchef</span>{% endif %}
        </label>
      {% endfor %}
    </div>
  {% endfor %}
  <small class="help"><a href="{% url 'dashboard:pictures' %}" target="_blank" rel="noopener">{% translate "Bildbibliothek öffnen" %}</a></small>
  {{ field.errors }}
</details>
