{% load i18n %}<section class="card calc" data-calc>
  <h2>{% translate "Preisrechner" %}</h2>
  <p class="small muted">{% translate "Nur eine Hilfe für den Tourenpreis. Spesen trägst du oben separat ein." %}</p>
  <div class="invoice-grid">
    <div class="field"><label for="calc-days">{% translate "Tage" %}</label>
      <input id="calc-days" type="number" min="0" step="0.5" value="{{ booking.days }}" data-calc-days></div>
    <div class="field"><label for="calc-rate">{% blocktranslate with n=booking.participants trimmed %}Tagesansatz Bergführer für {{ n }} Pers. (CHF){% endblocktranslate %}</label>
      <input id="calc-rate" type="number" min="0" step="10" value="{{ guide_rate|stringformat:'s' }}" data-calc-guide-rate></div>
    <div class="field"><label for="calc-extra">{% translate "Zusätzliche Bergführer" %}</label>
      <input id="calc-extra" type="number" min="0" max="9" step="1" value="0" data-calc-extra-guides></div>
    <div class="field"><label for="calc-aspirants">{% translate "Aspiranten" %}</label>
      <input id="calc-aspirants" type="number" min="0" max="9" step="1" value="0" data-calc-aspirants></div>
    <div class="field"><label for="calc-aspirant-rate">{% translate "Tagesansatz Aspirant (CHF)" %}</label>
      <input id="calc-aspirant-rate" type="number" min="0" step="10" value="{{ booking.guide.aspirant_day_rate|stringformat:'s' }}" data-calc-aspirant-rate></div>
  </div>
  <div class="invoice-total" aria-live="polite"><span>{% translate "Vorschlag" %}</span><strong>CHF <span data-calc-result>–</span></strong></div>
  <button class="btn btn-secondary" type="button" data-calc-apply>{% translate "Als Preis übernehmen" %}</button>
  <p class="small muted">{% translate "Ansätze und Stufen nach Gruppengrösse ändern:" %} <a href="{% url 'dashboard:settings' %}">{% translate "Einstellungen" %}</a></p>
</section>
