{% load i18n %}<figure class="library-item" id="bild-{{ pic.key }}">
  <img src="{{ pic.url }}" alt="{{ pic.title }}" loading="lazy">
  <figcaption class="small">
    {% if pic.is_stock %}<span class="pick-badge">Tourchef</span>{% else %}
    <form method="post" action="{% url 'dashboard:picture_action' pic.key 'speichern' %}" class="library-edit">{% csrf_token %}
      <input type="text" name="title" value="{{ pic.title }}" maxlength="120" placeholder="{% translate 'Name, z. B. Piz Palü Nordwand' %}" aria-label="{% translate 'Name' %}">
      <select name="category" aria-label="{% translate 'Tourenart' %}">{% for value, name in category_choices %}<option value="{{ value }}"{% if value == pic.category %} selected{% endif %}>{% if value %}{{ name }}{% else %}{% translate "Tourenart –" %}{% endif %}</option>{% endfor %}</select>
      <input type="text" name="region" value="{{ pic.region }}" maxlength="80" list="bild-regionen" placeholder="{% translate 'Region, z. B. Engadin' %}" aria-label="{% translate 'Region' %}">
      <input type="text" name="place" value="{{ pic.place }}" maxlength="120" list="bild-orte" placeholder="{% translate 'Ort, z. B. Diavolezza' %}" aria-label="{% translate 'Ort' %}">
      <select name="rating" aria-label="{% translate 'Bewertung' %}">{% for value, name in rating_choices %}<option value="{{ value }}"{% if value == pic.rating %} selected{% endif %}>{% if value %}{{ name }}{% else %}{% translate "Bewertung –" %}{% endif %}</option>{% endfor %}</select>
      <textarea name="note" rows="2" maxlength="500" placeholder="{% translate 'Eigene Bemerkung' %}" aria-label="{% translate 'Eigene Bemerkung' %}">{{ pic.note }}</textarea>
      <div class="row">
        <button class="btn btn-small btn-secondary" type="submit">{% translate "Speichern" %}</button>
        <button class="link-button small" type="submit" formaction="{% url 'dashboard:picture_action' pic.key 'loeschen' %}" data-confirm-click="{% translate 'Bild löschen?' %}">{% translate "Löschen" %}</button>
      </div>
    </form>
    {% endif %}
  </figcaption>
</figure>
