{% load i18n %}<figure class="library-item{% if pic.key == saved_key %} just-saved{% endif %}" id="bild-{{ pic.key }}">
  <img src="{{ pic.url }}" alt="{{ pic.title|default:pic.get_category_display }}" loading="lazy">
  <figcaption class="small">
    {% if pic.is_stock %}<span class="pick-badge">Tourchef</span>
    {% elif pic.needs_sorting %}{% include "dashboard/_library_form.html" %}
    {% else %}
    <details class="library-sorted">
      <summary>
        <span class="library-done"><span class="ok-mark" aria-hidden="true">✓</span>{% if pic.key == saved_key %} {% translate "Gespeichert" %}{% endif %}</span>
        <span class="library-tags">{{ pic.get_category_display }}{% if pic.region %} · {{ pic.region }}{% endif %}{% if pic.highlight %} · ★ {% translate "Highlight" %}{% endif %}</span>
        {% if pic.note %}<span class="library-note muted">{{ pic.note|truncatechars:80 }}</span>{% endif %}
        <span class="library-edit-link">{% translate "Bearbeiten" %}</span>
      </summary>
      {% include "dashboard/_library_form.html" %}
    </details>
    {% endif %}
  </figcaption>
</figure>
