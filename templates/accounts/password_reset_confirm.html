{% extends "base.html" %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<h1>Neues Passwort</h1>
{% if validlink %}
<form method="post" class="card">{% csrf_token %}
  {% include "_form.html" %}
  <button class="btn" type="submit">Speichern</button>
</form>
{% else %}
<p>Dieser Link ist ungültig oder abgelaufen. <a href="{% url 'accounts:password_reset' %}">Neuen Link anfordern</a></p>
{% endif %}
{% endblock %}
