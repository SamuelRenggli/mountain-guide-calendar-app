<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ guide_name }} – Buchungskalender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f9fa;
      color: #222;
      padding: 16px;
    }

    h2 {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a2e;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 1rem;
    }

    .nav button:hover { background: #e9ecef; }

    #month-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-name {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #888;
      padding: 4px 0;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: default;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }

    .day.empty { background: transparent; }

    .day.frei {
      background: #d1fae5;
      color: #065f46;
      cursor: pointer;
      border-color: #6ee7b7;
      font-weight: 600;
    }

    .day.frei:hover {
      transform: scale(1.08);
      background: #a7f3d0;
    }

    .day.blockiert {
      background: #fee2e2;
      color: #991b1b;
      text-decoration: line-through;
    }

    .day.gebucht {
      background: #e0e7ff;
      color: #3730a3;
    }

    .day.anfrage {
      background: #fef9c3;
      color: #92400e;
    }

    .day.past {
      background: #f1f1f1;
      color: #aaa;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #555;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Booking modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal h3 { margin-bottom: 16px; font-size: 1rem; color: #1a1a2e; }

    .modal label { display: block; font-size: 0.82rem; color: #555; margin-bottom: 4px; }

    .modal input, .modal select {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .modal input:focus, .modal select:focus { outline: 2px solid #6ee7b7; border-color: transparent; }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .btn-primary { background: #059669; color: #fff; }
    .btn-primary:hover { background: #047857; }
    .btn-cancel { background: #e5e7eb; color: #374151; }
    .btn-cancel:hover { background: #d1d5db; }

    .toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      z-index: 200;
    }

    .toast.show { display: block; }
  </style>
</head>
<body>

  <h2>{{ guide_name }}</h2>

  <div class="nav">
    <button id="prev">&#8592;</button>
    <span id="month-label"></span>
    <button id="next">&#8594;</button>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#d1fae5;border:1.5px solid #6ee7b7"></div> Verfügbar</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e0e7ff"></div> Gebucht</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fef9c3"></div> Anfrage</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fee2e2"></div> Blockiert</div>
  </div>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Buchungsanfrage</h3>
      <label>Name</label>
      <input type="text" id="guest-name" placeholder="Dein Name" />
      <label>E-Mail</label>
      <input type="email" id="guest-email" placeholder="deine@email.ch" />
      <label>Tour</label>
      <select id="tour-select"></select>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="modal-cancel">Abbrechen</button>
        <button class="btn btn-primary" id="modal-submit">Anfrage senden</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GUIDE_ID = {{ guide_id }};
    const API_BASE = "";   // same origin

    let timeslots = [];
    let touren = [];
    let currentYear, currentMonth;
    let selectedSlotId = null;

    const DAY_NAMES = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
    const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni",
                         "Juli","August","September","Oktober","November","Dezember"];

    async function fetchData() {
      const res = await fetch(`${API_BASE}/widget/${GUIDE_ID}/data`);
      const data = await res.json();
      timeslots = data.timeslots;
      touren = data.touren;
      populateTourSelect();
    }

    function populateTourSelect() {
      const sel = document.getElementById("tour-select");
      sel.innerHTML = "";
      touren.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = `${t.title} – CHF ${t.price}`;
        sel.appendChild(opt);
      });
    }

    function renderCalendar() {
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";

      document.getElementById("month-label").textContent =
        `${MONTH_NAMES[currentMonth]} ${currentYear}`;

      // Day headers
      DAY_NAMES.forEach(d => {
        const el = document.createElement("div");
        el.className = "day-name";
        el.textContent = d;
        cal.appendChild(el);
      });

      // First day of month (0=Sun..6=Sat → remap to Mon=0)
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const offset = (firstDay === 0) ? 6 : firstDay - 1;
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);

      for (let i = 0; i < offset; i++) {
        const el = document.createElement("div");
        el.className = "day empty";
        cal.appendChild(el);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const slot = timeslots.find(s => s.date === dateStr);
        const cellDate = new Date(currentYear, currentMonth, d);

        const el = document.createElement("div");
        el.textContent = d;

        if (cellDate < today) {
          el.className = "day past";
        } else if (slot) {
          el.className = `day ${slot.status}`;
          if (slot.status === "frei") {
            el.title = "Klicken zum Buchen";
            el.addEventListener("click", () => openModal(slot, dateStr));
          }
        } else {
          el.className = "day empty";
          el.style.background = "#f1f1f1";
          el.style.color = "#ccc";
        }

        cal.appendChild(el);
      }
    }

    function openModal(slot, dateStr) {
      selectedSlotId = slot.id;
      document.getElementById("modal-title").textContent = `Buchungsanfrage – ${dateStr}`;
      document.getElementById("guest-name").value = "";
      document.getElementById("guest-email").value = "";
      document.getElementById("modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
      selectedSlotId = null;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3500);
    }

    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", e => {
      if (e.target === document.getElementById("modal")) closeModal();
    });

    document.getElementById("modal-submit").addEventListener("click", async () => {
      const name = document.getElementById("guest-name").value.trim();
      const email = document.getElementById("guest-email").value.trim();

      if (!name || !email) { showToast("Bitte Name und E-Mail eingeben."); return; }

      const res = await fetch(`${API_BASE}/bookings/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ timeslot_id: selectedSlotId, guest_name: name, guest_email: email })
      });

      if (res.ok) {
        const booking = await res.json();
        closeModal();

        // Try to start Stripe Checkout
        const payRes = await fetch(`${API_BASE}/bookings/${booking.id}/pay`, { method: "POST" });
        if (payRes.ok) {
          const payData = await payRes.json();
          window.top.location.href = payData.checkout_url;
        } else {
          showToast("✓ Anfrage gesendet! Zahlung später möglich.");
          await fetchData();
          renderCalendar();
        }
      } else {
        const err = await res.json();
        showToast("Fehler: " + (err.detail || "Unbekannter Fehler"));
      }
    });

    document.getElementById("prev").addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });

    document.getElementById("next").addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });

    (async () => {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      await fetchData();
      renderCalendar();
    })();
  </script>
</body>
</html>
